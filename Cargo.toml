[package]
name = "yubiwatch-native"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Native Windows watchdog that locks the workstation when the configured YubiKey is absent."
license = "MIT"

[[bin]]
name = "yubiwatch"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
